# Hyprland/i3-inspired AeroSpace config.
# Reference: https://github.com/nikitabobko/AeroSpace

config-version = 2
start-at-login = true
automatically-unhide-macos-hidden-apps = true
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]
after-login-command = []
after-startup-command = [
  'exec-and-forget /bin/zsh -lc "$HOME/.config/sketchybar/plugins/aerospace_toggle.sh restore"',
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED="$AEROSPACE_FOCUSED_WORKSPACE"',
]

on-focus-changed = [
  'exec-and-forget sketchybar --trigger aerospace_focus_change',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

[workspace-to-monitor-force-assignment]
1 = "main"
2 = "main"
3 = "main"
4 = "main"
5 = "main"
6 = ["secondary", 1, "main"]
7 = ["secondary", 1, "main"]
8 = [3, "secondary", "main"]
9 = [3, "secondary", "main"]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 10
outer.bottom = 10
outer.top = 28
outer.right = 10

[mode.main.binding]
alt-slash = "layout tiles horizontal vertical"
alt-comma = "layout accordion horizontal vertical"
alt-backslash = "layout tiles horizontal vertical"
alt-shift-v = "layout accordion tiles"

alt-b = 'exec-and-forget /bin/zsh -lc "$HOME/.config/aerospace/scripts/open-app Zen new-window"'
alt-enter = 'exec-and-forget /bin/zsh -lc "$HOME/.config/aerospace/scripts/open-app Ghostty new-window"'
alt-u = 'exec-and-forget /bin/zsh -lc "$HOME/.config/aerospace/scripts/open-app Termius"'
alt-e = 'exec-and-forget /bin/zsh -lc "$HOME/.config/aerospace/scripts/open-app Emacs"'
alt-a = 'exec-and-forget /bin/zsh -lc "$HOME/.config/aerospace/scripts/open-app Codex"'
alt-c = 'exec-and-forget /bin/zsh -lc "$HOME/.config/aerospace/scripts/open-app Cursor"'
alt-v = 'exec-and-forget /bin/zsh -lc "$HOME/.config/aerospace/scripts/open-app \"Visual Studio Code\""'
alt-i = 'exec-and-forget /bin/zsh -lc "$HOME/.config/aerospace/scripts/open-app Messages"'
alt-d = 'exec-and-forget /bin/zsh -lc "$HOME/.config/aerospace/scripts/open-app Discord"'

alt-q = "close --quit-if-last-window"
alt-shift-q = 'exec-and-forget osascript -e "tell application \"System Events\" to keystroke \"q\" using command down"'
alt-shift-m = "macos-native-minimize"

alt-h = "focus --boundaries-action wrap-around-the-workspace left"
alt-j = "focus --boundaries-action wrap-around-the-workspace down"
alt-k = "focus --boundaries-action wrap-around-the-workspace up"
alt-l = "focus --boundaries-action wrap-around-the-workspace right"

alt-shift-h = "swap --wrap-around left"
alt-shift-j = "swap --wrap-around down"
alt-shift-k = "swap --wrap-around up"
alt-shift-l = "swap --wrap-around right"

alt-ctrl-h = "join-with left"
alt-ctrl-j = "join-with down"
alt-ctrl-k = "join-with up"
alt-ctrl-l = "join-with right"

alt-ctrl-left = "focus-monitor --wrap-around left"
alt-ctrl-down = "focus-monitor --wrap-around down"
alt-ctrl-up = "focus-monitor --wrap-around up"
alt-ctrl-right = "focus-monitor --wrap-around right"

alt-ctrl-shift-left = "move-node-to-monitor --focus-follows-window --wrap-around left"
alt-ctrl-shift-down = "move-node-to-monitor --focus-follows-window --wrap-around down"
alt-ctrl-shift-up = "move-node-to-monitor --focus-follows-window --wrap-around up"
alt-ctrl-shift-right = "move-node-to-monitor --focus-follows-window --wrap-around right"

alt-minus = "resize smart -50"
alt-equal = "resize smart +50"
alt-shift-minus = "resize height -50"
alt-shift-equal = "resize height +50"

alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"

alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"
alt-shift-6 = "move-node-to-workspace 6"
alt-shift-7 = "move-node-to-workspace 7"
alt-shift-8 = "move-node-to-workspace 8"
alt-shift-9 = "move-node-to-workspace 9"

alt-tab = "focus --boundaries-action wrap-around-the-workspace dfs-next"
alt-shift-tab = "focus --boundaries-action wrap-around-the-workspace dfs-prev"
alt-space = "focus-back-and-forth"
alt-w = "workspace-back-and-forth"
alt-ctrl-tab = "focus-monitor --wrap-around next"
alt-0 = "balance-sizes"
alt-shift-0 = ["flatten-workspace-tree", "balance-sizes"]

alt-f = "fullscreen"
alt-s = "layout v_accordion"
alt-shift-space = "layout floating tiling"
alt-shift-r = "reload-config"
alt-r = "mode resize"
alt-shift-semicolon = "mode service"

[mode.resize.binding]
esc = "mode main"
enter = "mode main"
h = "resize width -50"
j = "resize height +50"
k = "resize height -50"
l = "resize width +50"
shift-h = "move left"
shift-j = "move down"
shift-k = "move up"
shift-l = "move right"

[mode.service.binding]
esc = ["reload-config", "mode main"]
r = ["flatten-workspace-tree", "balance-sizes", "mode main"]
f = ["layout floating tiling", "mode main"]
backspace = ["close-all-windows-but-current", "mode main"]
alt-shift-h = ["join-with left", "mode main"]
alt-shift-j = ["join-with down", "mode main"]
alt-shift-k = ["join-with up", "mode main"]
alt-shift-l = ["join-with right", "mode main"]
